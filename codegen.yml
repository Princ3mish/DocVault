schema: src/schema/schema.graphql
generates:
  src/schema/generated.ts:
    plugins:
      - typescript
      - typescript-resolvers
    config:
      contextType: ../lib/context#GraphQLContext
      useIndexSignature: true
      mappers:
        Collection: "@prisma/client#Collection as PrismaCollection"
        Document: "@prisma/client#Document as PrismaDocument"
